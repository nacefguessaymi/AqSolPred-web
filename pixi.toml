[workspace]
authors = ["Nacef Guessaymi <nacefguess@hotmail.com>"]
channels = ["conda-forge"]
name = "AqSolPred-web"
platforms = ["osx-64", "linux-64"]
version = "0.1.0"

[environments]
dev = ["dev"]

[dependencies]
python = ">=3.7,<3.15"
rdkit = ">=2026.3.4,<2027"
xgboost = ">=3.3.0,<4"
scikit-learn = ">=1.9.0,<2"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
numpy = ">=2.5.1,<3"
streamlit = ">=1.59.2,<2"
click = ">=8.4.2,<9"
mordred = ">=1.2.0,<2"
pillow = ">=12.3.0,<13"
loguru = ">=0.7.3,<0.8"

[feature.dev.dependencies]
black = ">=26.5.1,<27"
isort = ">=8.0.1,<9"

[feature.dev.tasks]
format = {cmd = "black aqsolpred_web/ -t py314", description = "Run the black formatter"}
sort-imports = {cmd = "isort aqsolpred_web/", description = "Sort imports"}
