[workspace]
authors = ["Nacef Guessaymi <nacefguess@hotmail.com>"]
channels = ["conda-forge"]
name = "AqSolPred-web"
platforms = ["osx-64", "linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[environments]
dev = ["dev"]

[dependencies]
python = "==3.7.6"
rdkit = "2019.9.*"
xgboost = "1.0.2.*"
scikit-learn = "0.22.2.*"
scipy = "1.4.1.*"
pandas = "1.0.1.*"
numpy = "1.18.*"
streamlit = "0.70.*"
click = "7.1.2.*"
mordred = "1.2.0.*"
pillow = "7.0.0.*"
loguru = ">=0.6.0,<0.7"

[feature.dev.dependencies]
black = ">=21.12b0,<22"
isort = ">=5.11.5,<6"

[feature.dev.tasks]
format = {cmd = "black aqsolpred_web/ -t py314", description = "Run the black formatter"}
sort-imports = {cmd = "isort aqsolpred_web/", description = "Sort imports"}
clean-build = { cmd = "rm -rf build aqsolpred_web.egg-info && find . -name '__pycache__' -type d -exec rm -rf {} +", description = "Remove build artifacts, egg-info, and __pycache__ dirs" }

[package]
name = "aqsolpred-web"
version = "0.1.0"
 
[package.build]
backend = { name = "pixi-build-python", version = "0.*" }
 
[package.host-dependencies]
setuptools = ">=61"
 
[package.run-dependencies]
python = "==3.7.6"
rdkit = "2019.9.*"
xgboost = "1.0.2.*"
scikit-learn = "0.22.2.*"
scipy = "1.4.1.*"
pandas = "1.0.1.*"
numpy = "1.18.*"
streamlit = "0.70.*"
click = "7.1.2.*"
mordred = "1.2.0.*"
pillow = "7.0.0.*"
loguru = ">=0.6.0,<0.7"
